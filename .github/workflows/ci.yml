name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-webengine-dev qt6-webchannel-dev \
            libjpeg-dev zlib1g-dev libopenmpt-dev libgl-dev
      - name: Configure
        run: cmake -G Ninja -S . -B build -DFUGUE_RELEASE=ON -DFUGUE_COMPILE_JOBS=2
      - name: Build
        run: ninja -C build -j2
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          FUGUE_AUDIO: none
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox
        run: ctest --test-dir build --output-on-failure

  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: brew install cmake ninja pkgconf qtbase qtwebengine qtwebchannel qtsvg jpeg-turbo libopenmpt
      - name: Configure
        run: >-
          cmake -G Ninja -S . -B build -DFUGUE_RELEASE=ON -DFUGUE_OPENMPT=ON
          -DFUGUE_COMPILE_JOBS=2 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          -DPKG_CONFIG_EXECUTABLE="$(brew --prefix)/bin/pkg-config"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Keep test timers unthrottled
        # App Nap throttles the timers of a windowless background process, which the timing tests measure.
        run: defaults write NSGlobalDomain NSAppSleepDisabled -bool YES
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          FUGUE_AUDIO: none
        run: ctest --test-dir build --output-on-failure
      - name: Deploy and verify the standalone bundle
        run: |
          cmake --install build --prefix "$PWD/build/macos"
          build/macos/Fugue.app/Contents/MacOS/Fugue --version
          codesign --verify --deep --strict build/macos/Fugue.app
          ditto -c -k --sequesterRsrc --keepParent build/macos/Fugue.app "Fugue-$(uname -m).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Fugue-${{ matrix.os }}
          path: Fugue-*.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125   # v4.4.1
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows -DFUGUE_RELEASE=ON -DFUGUE_OPENMPT=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          FUGUE_AUDIO: none
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
        run: |
          $env:PATH = "$pwd/build/vcpkg_installed/x64-windows/bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure --timeout 120
      - name: Diagnose a crashing test
        if: failure()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          FUGUE_AUDIO: none
        run: |
          # A fail-fast exit loses buffered stdout, so run each function on its own and report its exit code.
          $env:PATH = "$pwd/build/vcpkg_installed/x64-windows/bin;$env:PATH"
          Get-ChildItem build -Recurse -Filter jpeg_test.exe | ForEach-Object {
            $exe = $_.FullName
            foreach ($f in (& $exe -functions)) {
              $out = & $exe $f -v2 2>&1 | Out-String
              "== $f exit=$LASTEXITCODE"
              if ($LASTEXITCODE -ne 0) { $out }
            }
          }
      - name: Package
        shell: pwsh
        run: ./packaging/windows/package.ps1 -QtDir "$env:QT_ROOT_DIR"
      - name: Smoke test deployed binary
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot/system32;$env:SystemRoot"
          & ./dist/bin/fugue-qt.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Deployed application failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: fugue-windows-x64
          path: dist/

  flatpak:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: fugue.flatpak
          manifest-path: packaging/flatpak/io.github.toomykins.Fugue.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Attach the bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          files: fugue.flatpak
